# 依赖版本目录 —— 所有第三方库版本只写这里(见 CLAUDE.md 第七节)
# build 脚本里用 libs.xxx 引用,不散落版本号。

[versions]
# —— 构建工具链 ——
agp = "8.7.3"                 # Android Gradle Plugin
kotlin = "2.1.0"              # Kotlin(与 Compose BOM 匹配)
ksp = "2.1.0-1.0.29"          # KSP(Room 编译器用)

# —— Compose ——
composeBom = "2024.12.01"     # Compose BOM(统一管理 compose 各库版本)
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"

# —— AndroidX 基础 ——
coreKtx = "1.15.0"
appcompat = "1.7.0"

# —— 数据 ——
room = "2.6.1"
datastore = "1.1.1"

# —— UI 辅助 ——
coil = "2.7.0"                          # 图片加载(封面)
palette = "1.0.0"                       # 封面取色
materialColorUtilities = "2.1.1"        # 封面种子色 → M3 ColorScheme(HCT)
accompanist = "0.36.0"                  # 按需(pager 等,官方已并入的会移除)

# —— 协程 ——
coroutines = "1.9.0"

# —— 测试 ——
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# —— AndroidX 基础 ——
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# —— Compose(BOM 管理,单库不填版本) ——
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# —— 数据 ——
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# —— UI 辅助 ——
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
material-color-utilities = { group = "com.materialkolor", name = "material-color-utilities", version.ref = "materialColorUtilities" }

# —— 协程 ——
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# —— 测试 ——
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
